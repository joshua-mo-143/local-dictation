[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-dictation"
version = "0.1.0"
description = "Local push-to-talk and voice-activated dictation for Linux desktops"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.4.6",
]

[project.optional-dependencies]
cpu = [
  "onnx-asr[hub]>=0.7.0",
  "onnxruntime>=1.20",
]
cuda = [
  "onnx-asr[gpu,hub]>=0.7.0",
]
whisper = [
  "faster-whisper>=1.2.1",
]

[project.scripts]
dictate = "local_dictation.cli:main"
local-dictation-server = "local_dictation.stt.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_dictation"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cuda" },
  ],
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
faulthandler_timeout = 120
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=local_dictation",
  "--cov-branch",
  "--cov-fail-under=75",
  "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
source = ["local_dictation"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true

[tool.local-dictation.coverage.module-minimums]
"src/local_dictation/service_manager.py" = 35
"src/local_dictation/user_config.py" = 80
